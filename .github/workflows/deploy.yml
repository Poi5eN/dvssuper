name: Super Admin CI/CD

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Create .env file
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env
          echo "VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}" >> .env

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create project directory on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /root/dvssuper

      - name: Transfer files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist,Dockerfile,nginx.conf"
          target: "/root/dvssuper"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /root/dvssuper
            echo "Building Docker image..."
            docker build -t dvssuper:latest . || { echo "Docker build failed"; exit 1; }
            echo "Stopping existing container..."
            docker stop dvssuper || true
            echo "Removing existing container..."
            docker rm dvssuper || true
            echo "Starting new container..."
            docker run -d -p 3005:80 --name dvssuper dvssuper:latest || { echo "Container start failed"; exit 1; }
            echo "Checking status..."
            docker ps | grep dvssuper
            echo "Cleaning up..."
            docker image prune -a -f
            echo "Deployment completed successfully!"
